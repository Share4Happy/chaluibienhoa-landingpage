<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Không tìm thấy trang | Chả Lụi Lạc Hồng</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #0e0f12;
      --card: #16171b;
      --accent: #ff541e;
      --text: #ffffff;
      --sub: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .box {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .code {
      font-size: 5rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--sub);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff541e, #ff7a00);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 84, 30, 0.4);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Trang Không Tồn Tại</h1>
    <p>Có vẻ như tọa độ quán này đã dời đi hoặc đường dẫn không chính xác. Hãy quay về trang chủ để tiếp tục săn lùng chả lụi Lạc Hồng!</p>
    <a href="/" class="btn">Quay Về Trang Chủ</a>
  </div>
</body>
</html>
